[package]
name = "lemon-mouth"
description = "Lemon Mouth: Lemon Studio's mouth-noise remover: clicks, smacks and saliva crackle out, words kept as a VST3 / CLAP plugin"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[features]
# Compiled into Lemon Studio: no exported plugin entry points (they would clash with the other built-in plugins).
linked = []

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false, features = ["vst3"] }
lemon-small-fx = { path = "../lemon-small-fx" }
os-plugkit = { path = "../../crates/os-plugkit" }
